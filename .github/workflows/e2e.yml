name: E2E

# End to end: both providers against the real flags-stack at .flags-stack-rev (`flags-stack all`:
# flags-api, the compiler worker, the change relay and flags-data), on Postgres 18 and Redis 8, with
# org-api faked by flags-stack's cmd/fake-orgapi (scripts/e2e.sh).
#
# flags-stack is internal: the job reads it with the FLAGS_STACK_DEPLOY_KEY secret (a read-only
# deploy key), and fails on a push to main when the secret is missing; pull requests without it
# (forks get no secrets) skip with a notice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.FLAGS_STACK_DEPLOY_KEY }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error title=e2e can't run::FLAGS_STACK_DEPLOY_KEY isn't set, so this job can't read ezgamehost/flags-stack. On main that's a failure, not a skip: restore the deploy key."; exit 1
          else echo "::notice title=e2e skipped::FLAGS_STACK_DEPLOY_KEY isn't available to this pull request; the end-to-end test didn't run."; fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        id: rev
        run: echo "sha=$(cat .flags-stack-rev)" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ezgamehost/flags-stack
          ref: ${{ steps.rev.outputs.sha }}
          ssh-key: ${{ secrets.FLAGS_STACK_DEPLOY_KEY }}
          path: .flags-stack
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: .flags-stack/go.mod
          cache-dependency-path: .flags-stack/go.sum
      - if: steps.token.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - if: steps.token.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        run: scripts/e2e.sh .flags-stack
      - if: failure() && steps.token.outputs.present == 'true'
        name: stack logs
        run: |
          tail -n 500 .bin/stack.log || true
          echo "--- fake-orgapi"; tail -n 100 .bin/fake-orgapi.log || true
